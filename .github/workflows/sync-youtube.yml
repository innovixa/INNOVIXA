
name: Sync INNOVIXA YouTube videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch YouTube videos and Shorts
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def fetch(url, attempts=5):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(
                          req, timeout=30
                      ) as response:
                          return response.read()

                  except urllib.error.HTTPError as error:
                      if error.code not in (
                          429, 500, 502, 503, 504
                      ):
                          raise

                      print("YouTube HTTP error:", error.code)

                  except (
                      urllib.error.URLError,
                      TimeoutError
                  ) as error:
                      print("Connection error:", error)

                  if attempt < attempts - 1:
                      delay = min(5 * (2 ** attempt), 30)
                      print("Retrying in", delay, "seconds")
                      time.sleep(delay)

              raise Exception(
                  "YouTube unavailable after all retries"
              )

          # INNOVIXA YouTube channel
          channel = "https://www.youtube.com/@INNOVIXA"

          html = fetch(channel).decode(
              "utf-8", "ignore"
          )

          match = re.search(
              r'"externalId"\s*:\s*"(UC[\w-]+)"',
              html
          )

          if not match:
              raise Exception(
                  "Could not find INNOVIXA channel ID"
              )

          channel_id = match.group(1)

          print("Channel ID:", channel_id)

          # YouTube RSS feed
          feed = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={channel_id}"
          )

          feed_data = fetch(feed)

          root = ET.fromstring(feed_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):

              vid = entry.findtext(
                  "yt:videoId",
                  namespaces=ns
              )

              if not vid:
                  continue

              title = entry.findtext(
                  "atom:title",
                  default="INNOVIXA Video",
                  namespaces=ns
              )

              published = entry.findtext(
                  "atom:published",
                  default="",
                  namespaces=ns
              )[:10]

              videos.append({
                  "id": vid,
                  "title": title,
                  "published": published,
                  "url": (
                      f"https://www.youtube.com/watch?v={vid}"
                  ),
                  "shorts_url": (
                      f"https://www.youtube.com/shorts/{vid}"
                  ),
                  "thumbnail": (
                      f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
                  )
              })

              if len(videos) >= 50:
                  break

          # Save videos.json
          output = Path("videos.json")

          output.write_text(
              json.dumps(
                  videos,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Successfully saved videos and Shorts:",
              len(videos)
          )
          PY

      - name: Save updated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube videos and Shorts"
            git push
          else
            echo "No video updates required"
          fi
