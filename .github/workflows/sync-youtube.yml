
      - name: Fetch regular YouTube videos
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Retry temporary YouTube server errors
          def fetch(req, timeout=30, attempts=5):
              last_error = None

              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(
                          req, timeout=timeout
                      ) as response:
                          return response.read(), response.geturl()

                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504):
                          raise
                      last_error = error

                  except (urllib.error.URLError, TimeoutError) as error:
                      last_error = error

                  if attempt < attempts - 1:
                      delay = min(5 * (2 ** attempt), 30)
                      print(
                          f"Temporary error: {last_error}. "
                          f"Retrying in {delay} seconds..."
                      )
                      time.sleep(delay)

              raise RuntimeError(
                  f"YouTube unavailable after {attempts} attempts: "
                  f"{last_error}"
              )

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          # Get YouTube channel
          channel = "https://www.youtube.com/@INNOVIXA"

          req = urllib.request.Request(
              channel, headers=headers
          )

          html, _ = fetch(req)

          match = re.search(
              r'"externalId"\s*:\s*"(UC[\w-]+)"',
              html.decode("utf-8", "ignore")
          )

          if not match:
              raise Exception("Could not find INNOVIXA channel ID")

          channel_id = match.group(1)

          print("Channel ID:", channel_id)

          # Fetch YouTube RSS feed
          feed = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={channel_id}"
          )

          req = urllib.request.Request(
              feed, headers=headers
          )

          feed_data, _ = fetch(req)

          root = ET.fromstring(feed_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):

              vid = entry.findtext(
                  "yt:videoId", namespaces=ns
              )

              if not vid:
                  continue

              # Check whether video is a Short
              shorts_url = (
                  f"https://www.youtube.com/shorts/{vid}"
              )

              req = urllib.request.Request(
                  shorts_url, headers=headers
              )

              try:
                  _, final_url = fetch(req, timeout=20)

                  path = urllib.parse.urlparse(
                      final_url
                  ).path

                  if path.startswith("/shorts/"):
                      print("Skipping Short:", vid)
                      continue

              except Exception as error:
                  print(
                      "Skipping uncertain video:",
                      vid, error
                  )
                  continue

              title = entry.findtext(
                  "atom:title",
                  default="INNOVIXA Video",
                  namespaces=ns
              )

              published = entry.findtext(
                  "atom:published",
                  default="",
                  namespaces=ns
              )[:10]

              videos.append({
                  "id": vid,
                  "title": title,
                  "published": published,
                  "url": (
                      f"https://www.youtube.com/watch?v={vid}"
                  ),
                  "thumbnail": (
                      f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
                  )
              })

              if len(videos) >= 12:
                  break

          # Save only after successful channel/feed retrieval
          Path("videos.json").write_text(
              json.dumps(
                  videos,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("Successfully saved regular videos:", len(videos))
          PY
