
name: Sync INNOVIXA YouTube videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch regular YouTube videos
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path

          channel = "https://www.youtube.com/@INNOVIXA"
          req = urllib.request.Request(
              channel, headers={"User-Agent": "Mozilla/5.0"}
          )
          html = urllib.request.urlopen(req).read().decode(
              "utf-8", "ignore"
          )

          match = re.search(
              r'"externalId"\s*:\s*"(UC[\w-]+)"', html
          )
          if not match:
              raise Exception("Could not find INNOVIXA channel ID")

          channel_id = match.group(1)
          feed = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={channel_id}"
          )

          req = urllib.request.Request(
              feed, headers={"User-Agent": "Mozilla/5.0"}
          )
          root = ET.fromstring(
              urllib.request.urlopen(req).read()
          )

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):
              vid = entry.findtext("yt:videoId", namespaces=ns)
              if not vid:
                  continue

              # Exclude videos that remain on the Shorts route.
              url = f"https://www.youtube.com/shorts/{vid}"
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  response = urllib.request.urlopen(
                      req, timeout=20
                  )
                  final_url = response.geturl()
                  path = urllib.parse.urlparse(final_url).path

                  if path.startswith("/shorts/"):
                      print("Skipping Short:", vid)
                      continue
              except Exception as error:
                  print("Skipping uncertain video:", vid, error)
                  continue

              title = entry.findtext(
                  "atom:title", default="INNOVIXA Video",
                  namespaces=ns
              )
              published = entry.findtext(
                  "atom:published", default="",
                  namespaces=ns
              )[:10]

              videos.append({
                  "id": vid,
                  "title": title,
                  "published": published,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "thumbnail": (
                      f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
                  )
              })

              if len(videos) >= 12:
                  break

          Path("videos.json").write_text(
              json.dumps(videos, indent=2, ensure_ascii=False) + "\n"
          )

          print("Saved regular videos:", len(videos))
          PY

      - name: Save updated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube videos"
            git push
          fi
